[project]
name = "fancut"
version = "0.1.0"
description = "FanCut API: watches the match while you sleep and wakes you before the moment that matters."
readme = "README.md"
license = "MIT"
authors = [
    { name = "eyekaushal" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-openai>=1.17.0",
    "fastapi>=0.161.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fancut = "fancut.__main__:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fancut"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
